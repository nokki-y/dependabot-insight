name: 'Dependabot Insight'
description: 'Analyze the impact scope of Dependabot PRs with static analysis and generate AI-powered QA reports'
author: 'nokki-y'

branding:
  icon: 'search'
  color: 'blue'

inputs:
  github-token:
    description: 'GitHub token for posting PR comments'
    required: true
  anthropic-api-key:
    description: 'Anthropic API key for AI QA report generation. If omitted, only the static impact analysis is posted'
    required: false
  ai-model:
    description: 'Claude model to use for QA report generation'
    required: false
    default: 'claude-sonnet-4-20250514'
  ai-language:
    description: 'Language for the AI QA report (e.g., en, ja)'
    required: false
    default: 'en'
  base-url:
    description: 'Base URL for GUI verification links in the QA report (e.g., Vercel preview URL)'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Resolve PR info
      id: pr
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
        elif [ "${{ github.event_name }}" = "issue_comment" ]; then
          PR_NUMBER="${{ github.event.issue.number }}"
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

          AUTHOR=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json author --jq '.author.login')
          if [ "$AUTHOR" != "app/dependabot" ]; then
            echo "::error::This PR was not created by Dependabot. Skipping."
            exit 1
          fi

          HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
        elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          PR_NUMBER="${{ github.event.inputs.pr_number }}"
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

          HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
        fi

    - name: Fetch Dependabot metadata
      id: metadata
      if: github.event_name == 'pull_request'
      uses: dependabot/fetch-metadata@d7267f607e9d3fb96fc2fbe83e0af444713e90b7 # v2
      with:
        github-token: ${{ inputs.github-token }}

    - name: Resolve dependency names from branch
      id: branch-metadata
      if: github.event_name != 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        PR_NUMBER="${{ steps.pr.outputs.number }}"
        BRANCH=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefName --jq '.headRefName')
        SLUG=$(echo "$BRANCH" | sed -E 's|^dependabot/[^/]+/||')

        if echo "$SLUG" | grep -qE '^multi-'; then
          TITLE=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json title --jq '.title')
          DEP_NAME=$(echo "$TITLE" | sed -E 's/^.*bump //' | sed -E 's/ from [0-9].*//' | sed 's/ and /,/g' | tr ',' '\n' | sed 's/^ *//;s/ *$//' | paste -sd ',' -)
        else
          DEP_NAME=$(echo "$SLUG" | sed -E 's|-[0-9]+\.[0-9]+.*$||')
        fi

        if [ -z "$DEP_NAME" ]; then
          echo "::error::Could not extract dependency name from branch: $BRANCH"
          exit 1
        fi

        echo "dependency-names=${DEP_NAME}" >> "$GITHUB_OUTPUT"

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22

    - name: Install action dependencies
      shell: bash
      run: cd "${{ github.action_path }}" && npm ci --production

    - name: Analyze impact and post comment
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names || steps.branch-metadata.outputs.dependency-names }}
        UPDATE_TYPE: ${{ steps.metadata.outputs.update-type || 'unknown' }}
        IMPACT_OUTPUT_PATH: /tmp/dependabot-impact-analysis.md
      run: |
        "${{ github.action_path }}/node_modules/.bin/tsx" "${{ github.action_path }}/src/impact-analysis.ts"

    - name: Generate test recommendations with AI
      if: inputs.anthropic-api-key != ''
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        AI_MODEL: ${{ inputs.ai-model }}
        AI_LANGUAGE: ${{ inputs.ai-language }}
        BASE_URL: ${{ inputs.base-url }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        IMPACT_OUTPUT_PATH: /tmp/dependabot-impact-analysis.md
      run: |
        "${{ github.action_path }}/node_modules/.bin/tsx" "${{ github.action_path }}/src/test-recommendation.ts"
